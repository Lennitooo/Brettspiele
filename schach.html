<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Schach – Spielesammlung</title>
  <meta name="theme-color" content="#d2451e">
  <link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="zurueck" href="index.html">Alle Spiele</a>
    <h1>Schach</h1>
    <nav class="auth" id="authbar"></nav>
  </header>
  <main>
    <div class="layout">
      <div class="board-wrap"><div id="board"></div></div>
      <aside class="panel">
        <div id="status"></div>
        <div class="geschlagen" id="geschlagen"></div>
        <div class="row">
          <label class="f">Modus
            <select id="mode">
              <option value="ki">Gegen KI</option>
              <option value="zwei">Zu zweit (lokal)</option>
              <option value="online">Online gegen Freund</option>
            </select>
          </label>
          <label class="f" id="farbeWrap">Du spielst
            <select id="farbe">
              <option value="w">Weiß</option>
              <option value="b">Schwarz</option>
            </select>
          </label>
        </div>
        <label class="f" id="stufeWrap">KI-Stärke
          <select id="stufe">
            <option value="1">Leicht</option>
            <option value="2">Mittel</option>
            <option value="3" selected>Schwer</option>
            <option value="4">Sehr schwer</option>
          </select>
        </label>
        <div id="onlineBox" style="display:none">
          <div id="onlineInfo" class="onlineinfo"></div>
          <button id="btnErstellen" class="primary">Partie erstellen</button>
          <div id="onlineLinkWrap" style="display:none">
            <label class="f">Link zum Teilen
              <input id="onlineLink" type="text" readonly>
            </label>
            <button id="btnKopieren">Link kopieren</button>
          </div>
        </div>
        <div class="row">
          <button id="neu" class="primary">Neues Spiel</button>
        </div>
        <div class="row">
          <button id="zurueck">Zurück</button>
          <button id="drehen">Drehen</button>
        </div>
        <div class="zugnav" id="zugnav">
          <button id="navAnfang" aria-label="Zur Startstellung" title="Zur Startstellung">⏮</button>
          <button id="navZurueck" aria-label="Einen Zug zurück ansehen" title="Einen Zug zurück">◀</button>
          <button id="navVor" aria-label="Einen Zug vor ansehen" title="Einen Zug vor">▶</button>
          <button id="navEnde" aria-label="Zur aktuellen Stellung" title="Zur aktuellen Stellung">⏭</button>
        </div>
        <div id="zuege"></div>
      </aside>
    </div>
  </main>
  <div id="promo"><div class="box">Umwandeln in:<div class="opts" id="promoOpts"></div></div></div>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="auth.js"></script>
  <script src="freunde.js"></script>
  <script src="engine.js"></script>
  <script src="anim.js"></script>
  <script src="sound.js"></script>
  <script src="schach.js"></script>
  <script src="online.js"></script>
  <script>Online.init({ spiel: 'schach', ui: window.SchachUI, farben: { w: 'Weiß', b: 'Schwarz' } });</script>
</body>
</html>
